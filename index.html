<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REQ Voice - 救急活動記録補助アプリ</title>
    <!-- Web App & iOS Safe Area Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --accent: #3b82f6;
            --border-color: #334155;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
            overflow: hidden;
        }

        /* 画面上部：ヘッダー */
        header {
            padding: 12px 16px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #f1f5f9;
        }

        /* 画面中央：テキスト表示エリア */
        #result-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        #result {
            flex: 1;
            white-space: pre-wrap;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
            user-select: text;
            -webkit-user-select: text;
            border-radius: 8px;
            background: var(--surface-color);
            padding: 16px;
            border: 1px solid var(--border-color);
            word-break: break-all;
        }

        #result:empty::before {
            content: "録音ボタンを押して会話を開始してください...";
            color: var(--text-sub);
        }

        /* 画面下部：コントロールエリア */
        .controls {
            padding: 16px;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 巨大録音ボタン */
        #main-btn {
            width: 100%;
            height: 64px;
            border-radius: 32px;
            background-color: var(--primary);
            color: white;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        #main-btn.active {
            background-color: #f59e0b;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.98);
            }

            100% {
                transform: scale(1);
            }
        }

        .sub-btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn-sub {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .btn-sub:active {
            background-color: var(--border-color);
        }

        /* モーダル表示 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--surface-color);
            padding: 24px;
            border-radius: 16px;
            width: 85%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .ai-select-btn {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        /* トースト通知 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <header>
        <h1>REQ Voice</h1>
        <button id="pc-mode-btn" class="btn-sub" style="flex-direction: row; padding: 6px 12px;">💻 PC入力モード: OFF</button>
    </header>

    <div id="result-container">
        <div id="result"></div>
    </div>

    <div class="controls">
        <div class="main-btn-wrapper">
            <button id="main-btn">
                <span id="main-btn-icon">🎙️</span>
                <span id="main-btn-text">録音開始</span>
            </button>
        </div>

        <div class="sub-btn-group">
            <button id="save-audio-btn" class="btn-sub">
                <span>🎵</span>
                <span>音声保存</span>
            </button>
            <button id="save-txt-btn" class="btn-sub">
                <span>📄</span>
                <span>テキスト保存</span>
            </button>
            <button id="ai-btn" class="btn-sub">
                <span>🤖</span>
                <span>AI要約</span>
            </button>
            <button id="clear-btn" class="btn-sub" style="color: #f87171;">
                <span>🗑️</span>
                <span>クリア</span>
            </button>
        </div>
    </div>

    <!-- AI選択モーダル -->
    <div id="ai-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">送信先AIを選択</div>
            <button id="select-gemini" class="ai-select-btn">
                <span>✨</span> Gemini
            </button>
            <button id="select-chatgpt" class="ai-select-btn">
                <span>🟢</span> ChatGPT
            </button>
            <button id="close-ai-modal" class="btn-sub" style="margin-top: 8px; padding: 10px;">キャンセル</button>
        </div>
    </div>

    <div id="toast" class="toast">クリップボードにコピーしました！</div>

    <script>
        // ── 富山弁・固有地名・救急用語の辞書補正テーブル ──
        const AUTO_CORRECT_MAP = {
            '難病': '南病', '富山南': '南病', '南病院': '南病',
            '市立': '市民', '市民病院': '市民',
            '赤十字': '日赤', '富山赤十字': '日赤',
            '県立': '中央', '中央病院': '中央',
            '大学病院': '医科薬科', '富大': '医科薬科',
            '労災': '労災', '済生会': '済生会',
            '高志': '高志リハ',
            'アルペン': 'アルペン',
            'まちなか': 'まちなか',
            '不二越': '不二越病院',
            '水橋': '水橋',
            '婦中': '婦中',
            '八尾': '八尾',
            '大沢野': '大沢野',
            '細入': '細入',
            '山田': '山田',
            '呉羽': '呉羽',
            '杉原': '杉原'
        };

        const TOYAMA_FORCE_DICT = {
            '富山': '富山',
            '総曲輪': 'そうがわ',
            '新総曲輪': 'しんそうがわ',
            '荒町': 'あらまち',
            '西町': 'にしちょう',
            '太田': 'おおた',
            '堀川': 'ほりかわ',
            '蜷川': 'にながわ',
            '掛尾': 'かけお',
            '黒瀬': 'くろせ',
            '根塚': 'ねづか',
            '布瀬': 'ふせ',
            '二口': 'ふたくち',
            '今泉': 'いまいずみ',
            '泉町': 'いずみちょう',
            '清水町': 'しみずちょう',
            '山室': 'やまむろ',
            '中川原': 'なかがわら',
            '公園木町': 'こうえんきのまち',
            '奥田': 'おくだ',
            '窪': 'くぼ',
            '下奥田': 'しもおくだ',
            '粟島': 'あわじま',
            '越前町': 'えちぜんまち',
            '千石町': 'せんごくちょう',
            '旅籠町': 'はたごまち',
            '安野屋': 'やすのや',
            '丸の内': 'まるのうち',
            '大手町': 'おおてまち',
            '本町': 'ほんまち',
            '桜町': 'さくらまち',
            '新富町': 'しんとみちょう',
            '明輪町': 'めいりんちょう',
            '牛島': 'うしじま',
            '湊入船': 'みなとおりふね',
            '北新町': 'きたしんまち',
            '向川原': 'むかいがわら',
            '東田地方': 'ひがしでんじがた',
            '双代町': 'そうだいちょう',
            '城村': 'じょうむら',
            '開発': 'かいほつ',
            '月岡': 'つきおか',
            '上滝': 'かみだき',
            '大庄': 'おおしょう'
        };

        let mediaRecorder = null;
        let audioChunks = [];
        let recognition = null;
        let activeStream = null;
        let finalTranscript = '';
        let isNewLine = true;
        let silenceTimer = null;

        const mainBtn = document.getElementById('main-btn');
        const mainBtnText = document.getElementById('main-btn-text');
        const mainBtnIcon = document.getElementById('main-btn-icon');
        const resultArea = document.getElementById('result');

        // ページ読み込み時にバックアップからテキストを復元
        window.addEventListener('DOMContentLoaded', () => {
            const savedText = localStorage.getItem('req_backup_text');
            if (savedText) {
                finalTranscript = savedText;
                resultArea.innerText = savedText;
                resultArea.scrollTop = resultArea.scrollHeight;
            }
        });

        function getFileTimestamp() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${y}${m}${d}_${hh}${mm}${ss}`;
        }

        function forceToyamaCorrect(text) {
            if (!text) return text;
            let corrected = text;
            for (const [wrong, right] of Object.entries(AUTO_CORRECT_MAP)) {
                corrected = corrected.replace(new RegExp(wrong, 'g'), right);
            }
            const sortedKeys = Object.keys(TOYAMA_FORCE_DICT).sort((a, b) => b.length - a.length);
            for (const key of sortedKeys) {
                corrected = corrected.replace(new RegExp(key, 'g'), TOYAMA_FORCE_DICT[key]);
            }
            return corrected;
        }

        function getTimestamp() {
            const now = new Date();
            return `${now.getHours()}時${now.getMinutes()}分${now.getSeconds()}秒 `;
        }

        mainBtn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                stopRecording();
            } else {
                startRecording();
            }
        };

        async function startRecording() {
            try {
                // Bluetoothマイク優先のための制約設定
                const constraints = {
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                };
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                audioChunks = [];

                const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                mediaRecorder = new MediaRecorder(activeStream, { mimeType });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.start();

                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'ja-JP'; recognition.continuous = true; recognition.interimResults = true;

                recognition.onresult = (e) => {
                    let interim = ""; let hasNewFinal = false;
                    for (let i = e.resultIndex; i < e.results.length; ++i) {
                        let transcript = forceToyamaCorrect(e.results[i][0].transcript);
                        if (e.results[i].isFinal) {
                            if (isNewLine) { finalTranscript += getTimestamp(); isNewLine = false; }
                            finalTranscript += transcript; hasNewFinal = true;
                        } else { interim += transcript; }
                    }
                    if (hasNewFinal) {
                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(() => {
                            if (finalTranscript !== "" && !finalTranscript.endsWith('\n')) {
                                finalTranscript += '\n'; resultArea.innerText = finalTranscript; isNewLine = true;
                                localStorage.setItem('req_backup_text', finalTranscript);
                            }
                        }, 5000);
                    }
                    resultArea.innerText = finalTranscript + (isNewLine && interim ? getTimestamp() : "") + interim;
                    localStorage.setItem('req_backup_text', resultArea.innerText); // 1文字ごとにバックアップ保存
                    resultArea.scrollTop = resultArea.scrollHeight;
                };

                recognition.onerror = (e) => console.error("Speech Error:", e.error);
                recognition.start();
                mainBtn.classList.add('active');
                document.body.classList.add('recording');
                isNewLine = true;
            } catch (err) {
                console.error("マイク取得エラー:", err.name, err.message);
                let errorMsg = "";
                switch (err.name) {
                    case "NotAllowedError":
                    case "PermissionDeniedError":
                        errorMsg = "マイクの使用が許可されていません。\n\n"
                            + "【許可する手順】\n"
                            + "① アドレスバー左の鍵マーク(🔒)をタップ\n"
                            + "② 「権限」または「サイトの設定」をタップ\n"
                            + "③ 「マイク」を「許可」に変更\n"
                            + "④ ページを再読み込みしてください";
                        break;
                    case "NotFoundError":
                    case "DevicesNotFoundError":
                        errorMsg = "マイクが見つかりません。\n\n"
                            + "・端末にマイクが接続されているか確認してください\n"
                            + "・Bluetoothイヤホンを使用する場合は、先にBluetooth接続を完了してからページを再読み込みしてください";
                        break;
                    case "NotReadableError":
                    case "TrackStartError":
                        errorMsg = "マイクが他のアプリで使用中か、アクセスできません。\n\n"
                            + "・他の録音アプリや通話を終了してください\n"
                            + "・Bluetoothイヤホンの場合は一度切断→再接続してからページを再読み込みしてください";
                        break;
                    case "OverconstrainedError":
                        errorMsg = "マイクの設定が端末に対応していません。\n再読み込みして再度お試しください。";
                        break;
                    case "AbortError":
                        errorMsg = "マイクの取得が中断されました。\nページを再読み込みして再度お試しください。";
                        break;
                    default:
                        errorMsg = "マイクの取得に失敗しました。\n\n"
                            + "以下をお試しください：\n"
                            + "① ブラウザのマイク権限を確認（アドレスバー左の🔒をタップ）\n"
                            + "② 他の録音アプリを終了\n"
                            + "③ ページを再読み込み\n\n"
                            + "（エラー詳細: " + err.name + "）";
                        break;
                }
                alert(errorMsg);
            }
        }

        function stopRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            if (recognition) recognition.stop();
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }
            clearTimeout(silenceTimer);
            mainBtn.classList.remove('active');
            document.body.classList.remove('recording');
        }

        document.getElementById('save-audio-btn').onclick = () => {
            // 安全策：録音中なら止める
            if (mediaRecorder && mediaRecorder.state === "recording") {
                stopRecording();
                // 停止処理に少し時間がかかるため、わずかに遅延させて保存を実行
                setTimeout(downloadAudio, 500);
            } else {
                downloadAudio();
            }
        };

        function downloadAudio() {
            if (audioChunks.length === 0) return alert("保存する音声データがありません。録音を一度完了させてください。");
            const blob = new Blob(audioChunks, { type: 'audio/mp4' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `REQ_audio_${getFileTimestamp()}.m4a`;
            a.click();
        }

        document.getElementById('save-txt-btn').onclick = () => {
            const text = resultArea.innerText;
            if (!text) return alert("テキストがありません");
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `REQ_log_${getFileTimestamp()}.txt`; a.click();
        };

        const AI_SUMMARY_PROMPT = `以下は、富山市消防局の救急隊が現場活動中に発した会話の音声文字起こしデータです。音声認識による誤変換・聞き取り不明瞭な箇所が含まれています。救急医療・消防の専門知識をもとに、下記の指示に従って整理・補正してください。

【整理の指示】
1. **誤変換の補正**：文脈から救急・消防用語や富山の地名として明らかに誤認識されている部分を適切に修正すること。
2. **時系列の整理**：「〇時〇分〇秒」の時刻ラベルを基準に、活動内容を時系列順に並べること。
3. **活動記録のまとめ**：以下の項目を可能な範囲で抽出・構造化すること。
   - 覚知・出動時刻
   - 現場到着時刻
   - 傷病者の主訴・バイタルサイン・観察所見
   - 実施した処置の内容と時刻
   - 医療機関への選定・搬送時刻・搬送先病院名
   - 病院到着時刻・引き継ぎ内容（記録があれば）
4. **不明箇所の明示**：文脈から補正が困難な箇所は【不明：〇〇】と記載すること。
5. **出力形式**：整理後の活動記録を読みやすい箇条書き・表形式でまとめること。

【音声文字起こしデータ】
`;

        /**
         * 個人情報マスキング処理
         * Geminiに送信する前に、氏名・生年月日・住所・電話番号等を伏字に変換する
         */
        function maskPersonalInfo(text) {
            let masked = text;

            // ── 電話番号 ──────────────────────────────────────────
            // 例: 090-1234-5678 / 0120-000-000 / (076)123-4567 / 0764321234
            masked = masked.replace(/(\(?\d{2,4}\)?[-・\s]?\d{2,4}[-・\s]?\d{3,4})/g, '[電話番号]');

            // ── 生年月日（元号・西暦） ────────────────────────────
            // 例: 昭和45年3月12日 / 平成2年10月1日 / 令和3年5月5日 / 1990年4月1日
            masked = masked.replace(/(昭和|平成|令和|大正|明治)\s*\d{1,2}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日/g, '[生年月日]');
            masked = masked.replace(/\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日生(まれ)?/g, '[生年月日]');
            masked = masked.replace(/生年月日\s*[:：]?\s*[\d年月日昭和平成令和大正明治\s]+/g, '生年月日：[生年月日]');

            // ── 住所 ─────────────────────────────────────────────
            // 例: 富山市総曲輪3丁目1番2号 / ○○番地 / ○○号室
            masked = masked.replace(/[\u4e00-\u9faf\u30a0-\u30ff]+[市区町村郡]\s*[\u4e00-\u9faf\u30a0-\u30ff\d]+\s*\d+\s*(丁目|番地?|号(室)?)/g, '[住所]');
            masked = masked.replace(/\d+\s*番地\s*\d*(号)?/g, '[住所(番地)]');

            // ── 郵便番号 ──────────────────────────────────────────
            masked = masked.replace(/〒?\s*\d{3}[-ー]\d{4}/g, '[郵便番号]');

            // ── 氏名（「さん」「様」「氏」「くん」「ちゃん」が後続する人名） ──
            // 例: 山田太郎さん / 田中花子様 / 佐藤一郎氏
            masked = masked.replace(/[\u4e00-\u9faf]{1,4}[\u4e00-\u9faf\u30a0-\u30ff]{1,4}\s*(さん|様|氏|くん|ちゃん|殿)/g, '[氏名]$1');

            // ── 氏名ラベルに続く氏名 ──────────────────────────────
            // 対応ラベル: 傷病者名・患者名・氏名・名前・お名前
            // 例: 「傷病者名は山田太郎」「患者名：田中花子」「お名前は佐藤一郎です」
            masked = masked.replace(
                /(傷病者名?|患者名?|お名前|名前|氏名)\s*[はがをも]?\s*[:：]?\s*[\u4e00-\u9faf\u30a0-\u30ff]{2,10}/g,
                '$1：[氏名]'
            );

            return masked;
        }

        const aiModal = document.getElementById('ai-modal');
        const aiBtn = document.getElementById('ai-btn');

        aiBtn.onclick = () => {
            const text = resultArea.innerText;
            if (!text.trim()) return alert("テキストがありません");
            aiModal.classList.add('show');
        };

        document.getElementById('close-ai-modal').onclick = () => {
            aiModal.classList.remove('show');
        };

        const handleAISubmission = async (url) => {
            const text = resultArea.innerText;
            const maskedText = maskPersonalInfo(text);
            const fullText = AI_SUMMARY_PROMPT + maskedText;
            
            try {
                await navigator.clipboard.writeText(fullText);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = fullText; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }

            aiModal.classList.remove('show');
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
            setTimeout(() => window.open(url, '_blank'), 400);
        };

         document.getElementById('select-gemini').onclick = () => handleAISubmission('https://gemini.google.com/app?hl=ja');
         document.getElementById('select-chatgpt').onclick = () => handleAISubmission('https://chatgpt.com/');

        document.getElementById('clear-btn').onclick = () => {
            if (confirm("すべて消去しますか？")) {
                resultArea.innerText = ''; finalTranscript = ''; audioChunks = []; isNewLine = true;
                localStorage.removeItem('req_backup_text'); // すべて消去時にバックアップも削除
                clearTimeout(silenceTimer);

                // PCモード関連の変数リセット
                if (typeof pcTimer !== 'undefined') clearTimeout(pcTimer);
                if (typeof lastConfirmedText !== 'undefined') lastConfirmedText = '';
            }
        };

        // ========== PC入力モード（裏モード）ロジック ==========
        let pcModeEnabled = false;
        let pcTimer = null;
        let lastConfirmedText = finalTranscript; // 既存テキストからスタート

        document.getElementById('pc-mode-btn').onclick = () => {
            pcModeEnabled = !pcModeEnabled;
            const btn = document.getElementById('pc-mode-btn');
            if (pcModeEnabled) {
                // PCモードON
                btn.style.background = '#1e3a8a';
                btn.style.color = '#ffffff';
                btn.innerText = '💻 PC入力モード: ON';
                resultArea.contentEditable = "true";
                resultArea.style.cursor = "text";
                resultArea.style.background = "#1e293b";
                resultArea.style.border = "2px solid #3b82f6";
                lastConfirmedText = resultArea.innerText;
                resultArea.focus();
                
                // 録音中なら停止
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    stopRecording();
                }
                mainBtn.style.opacity = "0.5";
                mainBtn.style.pointerEvents = "none"; // スマホ録音ボタンを無効化
            } else {
                // PCモードOFF
                btn.style.background = 'var(--surface-color)';
                btn.style.color = 'var(--text-color)';
                btn.innerText = '💻 PC入力モード: OFF';
                resultArea.contentEditable = "false";
                resultArea.style.cursor = "default";
                resultArea.style.background = "var(--surface-color)";
                resultArea.style.border = "2px solid var(--border-color)";
                mainBtn.style.opacity = "1";
                mainBtn.style.pointerEvents = "auto";
            }
        };

        resultArea.addEventListener('input', () => {
            if (!pcModeEnabled) return;
            
            finalTranscript = resultArea.innerText;
            localStorage.setItem('req_backup_text', finalTranscript);
            isNewLine = true; // PC入力後は次の音声認識も新しい行から始めることを想定

            clearTimeout(pcTimer);
            pcTimer = setTimeout(() => {
                let currentText = resultArea.innerText;
                let lctNoSpace = lastConfirmedText.replace(/\s/g, '');
                let curNoSpace = currentText.replace(/\s/g, '');
                
                // 追加文字があり、既存の部分が一致しているか判定
                if (curNoSpace.length > lctNoSpace.length && curNoSpace.startsWith(lctNoSpace)) {
                    let lctClean = lastConfirmedText.trim();
                    if (lctClean === "") {
                        let newChunk = currentText.trim();
                        if (newChunk.length > 0) insertTimestamp(newChunk, "");
                    } else {
                        let idx = currentText.lastIndexOf(lctClean);
                        if (idx !== -1) {
                            let newChunk = currentText.substring(idx + lctClean.length).trim();
                            if (newChunk.length > 0) insertTimestamp(newChunk, lctClean + "\n");
                        } else {
                            lastConfirmedText = currentText;
                        }
                    }
                } else {
                    lastConfirmedText = currentText;
                }
            }, 3000);
            
            function insertTimestamp(newChunk, baseText) {
                let updatedText = baseText + getTimestamp() + newChunk + "\n";
                resultArea.innerText = updatedText;
                lastConfirmedText = updatedText;
                finalTranscript = updatedText;
                localStorage.setItem('req_backup_text', updatedText);
                
                resultArea.focus();
                if (typeof window.getSelection !== "undefined" && typeof document.createRange !== "undefined") {
                    const range = document.createRange();
                    range.selectNodeContents(resultArea);
                    range.collapse(false);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
                resultArea.scrollTop = resultArea.scrollHeight;
            }
        });
        // ====================================================

    </script>
</body>

</html>
